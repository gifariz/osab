name: CI

on:
  push:
  pull_request:
  # "Run workflow" on the Actions page: also runs the Windows job (gui) below.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo run -q -p osab-cli -- bench
      # The browser build (web demo): solver and mesh step as WebAssembly.
      - run: cargo build --release --target wasm32-unknown-unknown -p osab-web

  # Desktop app (Windows): UI checks, unit tests (with the WebAssembly solver), the Playwright click
  # test, and on main the portable EXE plus installer as a downloadable artifact. Started by hand only
  # (Actions > CI > Run workflow): Windows minutes count double, and these checks run locally before every push.
  gui:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: cargo clippy -p osab-gui --all-targets -- -D warnings
      - run: cargo test -p osab-gui
      - run: npx playwright install chromium
      - run: npm run e2e
      - name: Build the app (portable EXE and installer)
        if: github.ref == 'refs/heads/main'
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: OSAB-windows
          path: |
            target/release/osab-gui.exe
            target/release/bundle/nsis/*.exe

  # Web demo (Linux): the static build for gifariz.com/osab/ and its click tests against
  # that build; the folder is the downloadable artifact OSAB-web (deploy: docs/phases/WEB_DEMO_PLAN.md).
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm test
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:web
      - uses: actions/upload-artifact@v4
        with:
          name: OSAB-web
          path: gui/dist-web/
